<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Akaza Blast Platform</title>
  <meta name="description" content="Halaman login khusus Administrator Akaza Blast Platform">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .admin-login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 36px 30px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    .admin-brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .admin-logo-box {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 24px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
      margin-bottom: 12px;
    }

    .admin-badge {
      display: inline-block;
      background: #fee2e2;
      color: #dc2626;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    .admin-title {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.4px;
    }

    .admin-subtitle {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 46px;
      background: #f1f5f9;
      border: none !important;
      outline: none !important;
      border-radius: 10px;
      padding: 0 14px 0 40px;
      font-family: inherit;
      font-size: 13.5px;
      color: #0f172a;
      transition: all 0.2s;
    }

    .form-input:focus {
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.25) !important;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
    }

    .input-icon-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
    }

    .admin-login-btn {
      width: 100%;
      height: 46px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      outline: none !important;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 22px;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
    }

    .admin-login-btn:hover {
      background: #4338ca;
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
    }

    .admin-login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert-error {
      background: #fef2f2;
      color: #dc2626;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.2s ease;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      font-size: 12.5px;
      font-weight: 600;
      color: #64748b;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .back-link a:hover {
      color: #4f46e5;
    }

    .admin-hint {
      margin-top: 24px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      font-size: 11.5px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="admin-login-card">
    <div class="admin-brand">
      <div class="admin-logo-box">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div>
        <span class="admin-badge"><i class="fa-solid fa-lock"></i> Restricted Access</span>
        <h1 class="admin-title">Admin Console</h1>
        <p class="admin-subtitle">Masuk untuk mengelola blast engine &amp; mitra</p>
      </div>
    </div>

    <div class="alert-error" id="login-error">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="login-error-text">Username atau password salah</span>
    </div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label class="form-label" for="admin-user">Username Admin</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user-shield input-icon-left"></i>
          <input type="text" id="admin-user" class="form-input" placeholder="admin" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="admin-pass">Password Admin</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key input-icon-left"></i>
          <input type="password" id="admin-pass" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="input-icon-toggle" onclick="togglePassVisibility()" title="Lihat password">
            <i class="fa-solid fa-eye" id="toggle-eye-icon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="admin-login-btn" id="login-btn">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk ke Console Admin
      </button>
    </form>

    <div class="back-link">
      <a href="/">
        <i class="fa-solid fa-arrow-left"></i> Kembali ke Portal Mitra
      </a>
    </div>

    <div class="admin-hint">
      <i class="fa-solid fa-shield-halved" style="color:var(--primary);margin-right:4px;"></i> Akses terbatas khusus administrator resmi Akaza Blast.
    </div>
  </div>

  <script>
    // If already has active admin token, verify and redirect to /admin
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('akaza_admin_token');
      if (token) {
        try {
          const res = await fetch('/api/admin/check-session', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            window.location.href = '/admin';
          }
        } catch (_) {}
      }
    });

    function togglePassVisibility() {
      const passInput = document.getElementById('admin-pass');
      const eyeIcon = document.getElementById('toggle-eye-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-solid fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-solid fa-eye';
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const userEl = document.getElementById('admin-user');
      const passEl = document.getElementById('admin-pass');
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('login-error');
      const errText = document.getElementById('login-error-text');

      errBox.style.display = 'none';

      const username = userEl.value.trim();
      const password = passEl.value;

      if (!username || !password) return;

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('akaza_admin_token', data.token);
          localStorage.setItem('akaza_admin_username', data.username || 'admin');
          window.location.href = '/admin';
        } else {
          errText.textContent = data.error || 'Username atau password salah';
          errBox.style.display = 'flex';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk ke Console Admin';
          passEl.focus();
        }
      } catch (err) {
        errText.textContent = 'Gagal menghubungi server';
        errBox.style.display = 'flex';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk ke Console Admin';
      }
    }
  </script>
</body>
</html>
